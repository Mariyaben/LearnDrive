name: LearnDrive
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
    SWIFT_OBJC_BRIDGING_HEADER: LearnDrive/LearnDrive-Bridging-Header.h
    PRODUCT_BUNDLE_IDENTIFIER: ai.learndrive.mobile
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
targets:
  LearnDrive:
    type: application
    platform: iOS
    sources:
      - path: LearnDrive
      - path: ../core/src
      - path: ../core/include
    info:
      path: LearnDrive/Info.plist
      properties:
        CFBundleDisplayName: LearnDrive.AI
        NSCameraUsageDescription: Rear camera supplies local driving-scene analysis.
        NSLocationWhenInUseUsageDescription: GPS speed is fused with on-device motion sensors.
        NSMotionUsageDescription: Motion sensors estimate pitch and braking on device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreLocation.framework
      - sdk: CoreML.framework
